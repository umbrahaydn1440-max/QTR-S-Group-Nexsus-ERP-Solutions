<style>
:root{--ac:#8a1538;--bg:#f3f5f9;--cd:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#e3e6ec;--nv:#14213d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141c;--cd:#181e2a;--tx:#e6e9f0;--mu:#93a0b5;--bd:#2a3344}}
:root[data-theme=dark]{--bg:#10141c;--cd:#181e2a;--tx:#e6e9f0;--mu:#93a0b5;--bd:#2a3344}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:flex;min-height:100%}.side{width:232px;background:var(--nv);color:#cfd6e4;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;align-self:flex-start}
.lg{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px}.lg img{width:100%;display:block}
.cs button{display:block;width:100%;text-align:left;background:#1e2d4d;color:#cfd6e4;border:1px solid #2c3d63;border-radius:7px;padding:6px 9px;margin:3px 0;font-size:12px;cursor:pointer}.cs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.nv{margin-top:12px}.nv a{display:block;padding:9px 10px;border-radius:7px;cursor:pointer;color:#cfd6e4}.nv a.on{background:#fff2;color:#fff;border-left:3px solid var(--ac)}
.main{flex:1;min-width:0;padding:20px 24px}.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}.sh h2,.sh h3{margin:0}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:11px;padding:14px;margin-bottom:14px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp .cd{margin:0}.kp strong{display:block;font-size:21px;margin:4px 0;color:var(--ac)}small,.mu{color:var(--mu)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--cd)}th{text-align:left;color:var(--mu);font-weight:600;background:var(--bg)}th,td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td a{color:var(--ac);cursor:pointer;margin-right:10px;font-weight:600}.b{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
.bg{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}.g{background:#e3f6ec;color:#0b7a4b}.o{background:#fff1d9;color:#a8650a}.r{background:#fde8e8;color:#b02a2a}.b.bg,.bg.b{background:#e6efff;color:#1c5fb8}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}.tabs a{padding:8px 14px;cursor:pointer;color:var(--mu);font-weight:600;white-space:nowrap}.tabs a.on{color:var(--ac);border-bottom:3px solid var(--ac)}
.live{color:#16a36a;font-weight:700}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#md{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:9;padding:12px}.box{background:var(--cd);color:var(--tx);border-radius:12px;padding:18px;width:min(900px,100%);max-height:92vh;overflow:auto}
.box h3{margin:0 0 12px;display:flex;justify-content:space-between}.x{cursor:pointer;font-size:22px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}td input,td select{min-width:70px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dh{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ac);padding-bottom:8px;margin-bottom:10px}.dh img{height:54px;background:#fff;border-radius:6px}.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.sg{display:flex;justify-content:space-between;margin-top:40px}.sg span{border-top:1px solid var(--mu);padding-top:4px;width:30%;text-align:center;font-size:12px}.r{text-align:right}p.r{text-align:right}
@media(max-width:820px){.app{display:block}.side{width:auto;height:auto;position:static}.nv{display:flex;overflow-x:auto}.g2,.fg{grid-template-columns:1fr}.main{padding:14px}}
@media print{.side,.main,.noprint{display:none!important}#md{position:static;background:none;display:block!important}.box{max-height:none;box-shadow:none;color:#000}}

.tbar{display:flex;align-items:center;gap:16px;background:var(--nv);color:#fff;margin:-20px -24px 14px;padding:10px 24px;flex-wrap:wrap}.tbar input{width:min(380px,100%);background:#ffffff1a;color:#fff;border-color:#fff3}.tl a{color:#cfd6e4;margin-right:14px;cursor:pointer;font-size:12px}.tbar>div:first-child{flex:1}
.qa{margin-top:14px;border-top:1px solid #fff2;padding-top:10px}.qa button{display:block;width:100%;text-align:left;background:transparent;color:#cfd6e4;border:1px solid #fff3;border-radius:7px;padding:7px 10px;margin:5px 0;cursor:pointer;font-size:12px}.qa button:hover{background:#fff2}
.fr{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fr label{min-width:170px;font-size:11px;color:var(--mu)}.fr>span{margin-left:auto}
.ban{background:linear-gradient(100deg,#0d1b34 45%,#2a4f86 100%);color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px}.tiles{display:flex;gap:8px;flex-wrap:wrap}.tiles a{background:#fff;color:#14213d;border-radius:8px;padding:7px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;border:2px solid transparent}.tiles a.on{border-color:#2f6fe4}.tiles img{height:26px;max-width:80px;object-fit:contain}
.kc{display:flex;gap:10px;align-items:flex-start}.ic{width:38px;height:38px;border-radius:50%;background:#e8f0ff;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}.kc>div{flex:1;min-width:0}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:12px;margin-bottom:12px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}.g3 .cd,.g4 .cd{margin:0}.g3 h3,.g4 h3{margin:0 0 8px;font-size:14px}.lk{color:var(--ac);cursor:pointer;font-size:12px}
.dn{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.dn span{background:var(--cd);width:60%;height:60%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;flex-direction:column;line-height:1.1}.dn.l{width:140px;height:140px}.dn.l span{width:72%;height:72%}
.al{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}.wf{display:flex;gap:6px;text-align:center;justify-content:space-between}.wf div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}.wf span{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.wf small{font-size:10px}
@media(max-width:1100px){.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:820px){.g3,.g4{grid-template-columns:1fr}.tbar{margin:-14px -14px 12px}}
.th{width:44px;height:36px;object-fit:cover;border-radius:5px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}.ph{height:120px;background:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:28px}

const RM={admin:MODS.map(m=>m[0]),procurement:['dash','proc','sup','inv','docs'],store:['dash','inv','proj','log'],fleet:['dash','fleet','mnt','log','docs'],finance:['dash','fin','rep','sales'],viewer:['dash','rep']};
async function H(s){s='qn:'+s;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'd'+h}}
async function login(){const u=S.users.find(x=>x.user==V('lu').trim().toLowerCase());if(!u||u.hash!=await H(V('lp'))){$('#le').textContent='Invalid username or password';return}CU=u;try{sessionStorage.setItem('nxu',u.id)}catch(e){}if(u.co!='all'){co=u.co;GV=false}pg=u.mods.includes('dash')?'dash':u.mods[0];go()}
const logout=()=>{CU=null;try{sessionStorage.removeItem('nxu')}catch(e){}go()};
const loginView=()=>{$('#app').innerHTML=`<div style="margin:auto;max-width:380px;width:100%;padding:30px 16px"><div class=cd style="padding:24px"><img src="${CO.qtrs.l}" style="width:100%;background:#fff;border-radius:8px;padding:8px"><h2 style="text-align:center">Supply Chain & Logistics ERP</h2><label>Username<input id=lu autofocus></label><br><br><label>Password<input id=lp type=password onkeydown="if(event.key=='Enter')login()"></label><p id=le style="color:#d33;min-height:18px"></p><button class="b p" style="width:100%" onclick="login()">Sign in</button><p class=mu style="font-size:12px">First-time admin: <b>admin</b> / <b>admin123</b>. Change it in Users & Logins after signing in.</p></div></div>`};
function uf(id){const u=id?S.users.find(x=>x.id==id):{role:'viewer',co:'all',mods:RM.viewer};UE=id;M(id?'Edit user':'New user',`<div class=fg><label>Full name*<input id=u_n value="${E(u.name)}"></label><label>Username*<input id=u_u value="${E(u.user)}"></label><label>Password ${id?'(blank keeps current)':'*'}<input id=u_p type=password></label><label>Role (presets modules)<select id=u_r onchange="rolePick()">${Object.keys(RM).map(r=>`<option${r==u.role?' selected':''}>${r}</option>`).join('')}</select></label><label>Company access<select id=u_c><option value=all${u.co=='all'?' selected':''}>All companies</option>${Object.keys(CO).map(k=>`<option value=${k}${u.co==k?' selected':''}>${CO[k].n}</option>`).join('')}</select></label></div><p><b>Assigned modules</b></p><div class=fg>${MODS.map(m=>`<label><input type=checkbox class=um value=${m[0]}${u.mods.includes(m[0])?' checked':''} style="width:auto"> ${m[1]}</label>`).join('')}</div>`,'usv()')}
const rolePick=()=>{const r=RM[V('u_r')];document.querySelectorAll('.um').forEach(c=>c.checked=r.includes(c.value))};
async function usv(){const n=V('u_n').trim(),un=V('u_u').trim().toLowerCase(),p=V('u_p');if(!n||!un||(!UE&&!p))return alert('Name, username and password are required');if(S.users.some(x=>x.user==un&&x.id!=UE))return alert('Username already exists');const mods=[...document.querySelectorAll('.um:checked')].map(c=>c.value),o={name:n,user:un,role:V('u_r'),co:V('u_c'),mods};if(p)o.hash=await H(p);if(UE)Object.assign(S.users.find(x=>x.id==UE),o);else S.users.push({id:'u'+Date.now(),...o});save();X();go()}
const udel=id=>{if(confirm('Delete this user?')){S.users=S.users.filter(x=>x.id!=id);save();go()}};
const usrp=()=>`<div class=sh><h3>Users & logins</h3><button class="b p" onclick="uf()">+ New user</button></div>`+tb(['Name','Username','Role','Company access','Modules',''],S.users.map(u=>[E(u.name),u.user,u.role,u.co=='all'?'All companies':CO[u.co].n,u.mods.length+' assigned',`<a onclick="uf('${u.id}')">Edit</a>`+(u.id==CU.id?'':`<a onclick="udel('${u.id}')">Delete</a>`)]))+'<p class=mu>Passwords are stored as hashes in this browser. Module and company assignment separates workflows; it is not hardened server-side security.</p>';
NAV.find(n=>n[0]=='inv')[2]=inv2;NAV.find(n=>n[0]=='inv')[1]='📦 Inventory / Store';
NAV.splice(5,0,['sales','💼 Sales',sales]);NAV.push(['usr','🔐 Users & Logins',usrp]);
function ensure3(){['drv','inc'].forEach(k=>S[k]=S[k]||[]);const o=['Qatar','UAE','China','India','Turkey'],sp0=['Standard grade','Heavy duty','Industrial','Class A'];
S.items.forEach((x,i)=>{if(x.origin==null){x.origin=o[i%5];x.spec=sp0[i%4];x.price=Math.round(x.cost*125)/100;x.rem='';x.srem='';if(x.unit=='btl')x.exp=ago(-(35+(i%3)*120))}});S.items.forEach(x=>{if(!/^ITM-/.test(x.code))x.code=genCode()});
S.veh.forEach((v,i)=>{if(v.reg==null){v.reg=ago(-(80+i*35));v.color=['White','Silver','Blue'][i%3];v.chassis='VIN'+(900000+i*137);v.cap=['4.5 t','1 t','22 seats'][i%3]}});
if(!S.drv.length)S.veh.forEach((v,i)=>S.drv.push({id:'dr'+i,co:v.co,name:v.drv,code:'EMP-'+(100+i),phone:'+974 5500 '+(1000+i*7),lic:'QL-'+(70000+i*11),licx:ago(-(60+i*50)),veh:v.id,st:'Active'}));
if(!S.inc.length)Object.keys(CO).forEach(c=>{const v=S.veh.find(x=>x.co==c);if(v)S.inc.push({id:'in'+c,co:c,date:ago(12),veh:v.id,type:'Traffic fine',drv:v.drv,amt:300,st:'Open',note:'Speeding'})});save()}
</script><script>
/* v5: Supabase backend (shared data, real logins, realtime) */
const sb=supabase.createClient(SB_URL,SB_KEY);
const COLS=['items','sup','po','pr','proj','mr','miv','dn','veh','trip','fuel','mnt','sale','docs','acc','fin','drv','inc'];
let SNAP={},busy=false,again=false,tm,RT,PROF=[],PL=false,PEND=false,AUTHMSG='',SU=false;
const stat=(t,c)=>{const e=$('#st');if(e){e.textContent=t;e.style.color=c||''}},sk=(k,r)=>k+'|'+r.id;
async function loadAll(){const d={};COLS.forEach(k=>d[k]=[]);SNAP={};for(let f=0;;f+=1000){const{data,error}=await sb.from('records').select('collection,data').order('collection').order('id').range(f,f+999);if(error)throw error;data.forEach(r=>{if(d[r.collection]){d[r.collection].push(r.data);SNAP[sk(r.collection,r.data)]=JSON.stringify(r.data)}});if(data.length<1000)break}S=d}
const sched=()=>{stat('Saving…','#c80');clearTimeout(tm);tm=setTimeout(push,500)};
async function push(){if(busy){again=true;return}busy=true;try{const up=[],cur=new Set();COLS.forEach(k=>S[k].forEach(r=>{const key=sk(k,r),j=JSON.stringify(r);cur.add(key);if(SNAP[key]!==j)up.push({collection:k,id:r.id,co:r.co||null,data:r,j,key})}));const del=Object.keys(SNAP).filter(k=>!cur.has(k));
for(let i=0;i<up.length;i+=100){const ch=up.slice(i,i+100),{error}=await sb.from('records').upsert(ch.map(({j,key,...x})=>x),{onConflict:'collection,id'});if(error)throw error;ch.forEach(x=>SNAP[x.key]=x.j)}
for(const key of del){const[k,id]=key.split('|'),{error}=await sb.from('records').delete().eq('collection',k).eq('id',id);if(error)throw error;delete SNAP[key]}
stat('● Saved','#16a36a')}catch(e){stat('Save failed','#d33');alert('Could not save: '+(e.message||e))}busy=false;if(again){again=false;push()}}
function subscribe(){sb.removeAllChannels();sb.channel('rec').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{const n=p.new&&p.new.collection?p.new:p.old,k=n&&n.collection,id=n&&n.id;if(!k||!S[k])return;const key=k+'|'+id;
if(p.eventType=='DELETE'){S[k]=S[k].filter(r=>r.id!=id);delete SNAP[key]}else{const j=JSON.stringify(p.new.data);if(SNAP[key]===j)return;const i=S[k].findIndex(r=>r.id==id);if(i<0)S[k].push(p.new.data);else S[k][i]=p.new.data;SNAP[key]=j}
clearTimeout(RT);RT=setTimeout(()=>{if(CU&&$('#md').style.display!='flex'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))go()},300)}).subscribe()}
async function enter(u){const{data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(!p||!p.active){AUTHMSG='This account is not active. Contact your administrator.';await sb.auth.signOut();CU=null;return go()}
if(p.role=='pending'){CU=null;PEND=true;return go()}
CU={id:p.id,name:p.name||p.email,email:p.email,role:p.role,co:p.co,mods:p.role=='admin'?RM.admin:(p.mods||[])};if(CU.co!='all'){co=CU.co;GV=false}pg=CU.mods.includes('dash')?'dash':CU.mods[0]||'dash';
try{await loadAll();subscribe();PL=false;stat('● Live','#16a36a')}catch(e){alert('Could not load data: '+(e.message||e))}go()}
async function login2(){const{data,error}=await sb.auth.signInWithPassword({email:V('lu').trim(),password:V('lp')});if(error){$('#le').textContent=error.message;return}AUTHMSG='';PEND=false;await enter(data.user)}
async function signup2(){const{data,error}=await sb.auth.signUp({email:V('lu').trim(),password:V('lp'),options:{data:{name:V('ln').trim()}}});if(error){$('#le').textContent=error.message;return}if(!data.session){$('#le').textContent='Check your email to confirm the account, then sign in.';return}await enter(data.user)}
async function logout2(){clearTimeout(tm);if(CU)await push();await sb.auth.signOut();sb.removeAllChannels();CU=null;PEND=false;S={};go()}
const loginView2=()=>{$('#app').innerHTML=`<div style="margin:auto;max-width:380px;width:100%;padding:30px 16px"><div class=cd style="padding:24px"><img src="${CO.qtrs.l}" style="width:100%;background:#fff;border-radius:8px;padding:8px"><h2 style="text-align:center">Supply Chain & Logistics ERP</h2>${PEND?'<p>Your account is waiting for administrator approval.</p><button class=b onclick="logout2()">Sign out</button>':`${SU?'<label>Full name<input id=ln></label><br><br>':''}<label>Email<input id=lu type=email autofocus></label><br><br><label>Password<input id=lp type=password onkeydown="if(event.key==\'Enter\')${SU?'signup2':'login2'}()"></label><p id=le style="color:#d33;min-height:18px">${E(AUTHMSG)}</p><button class="b p" style="width:100%" onclick="${SU?'signup2':'login2'}()">${SU?'Create account':'Sign in'}</button><p class=mu style="font-size:12px;cursor:pointer" onclick="SU=!SU;go()">${SU?'Have an account? Sign in':'New here? Create an account (an administrator must approve it)'}</p>`}</div></div>`};
async function loadProf(){const{data}=await sb.from('profiles').select('*').order('email');PROF=data||[];PL=true;if(pg=='usr')go()}
const usr2=()=>{if(!PL){PL=true;loadProf()}return`<div class=sh><h3>Users & logins</h3><button class="b p" onclick="uf2()">+ New user</button></div>`+tb(['Name','Email','Role','Company access','Modules','Status',''],PROF.map(u=>[E(u.name),E(u.email),u.role,u.co=='all'?'All companies':(CO[u.co]||{n:u.co}).n,u.role=='admin'?'All':(u.mods||[]).length+' assigned',bd(u.active?'Active':'Inactive'),`<a onclick="uf2('${u.id}')">Edit</a>`]))+'<p class=mu>New sign-ups appear as "pending": edit them to set a role, company and modules. Passwords are handled by Supabase (reset from the Supabase dashboard). Company access and read-only roles are enforced by the database.</p>'};
function uf2(id){const u=id?PROF.find(x=>x.id==id):{role:'viewer',co:'all',mods:RM.viewer,active:true};UE=id;M(id?'Edit user':'New user',`<div class=fg><label>Full name*<input id=u_n value="${E(u.name)}"></label>${id?`<label>Email<input value="${E(u.email)}" disabled></label>`:'<label>Email*<input id=u_u type=email></label><label>Password (6+ chars)*<input id=u_p type=password></label>'}<label>Role (presets modules)<select id=u_r onchange="rolePick()">${Object.keys(RM).concat(['pending']).map(r=>`<option${r==u.role?' selected':''}>${r}</option>`).join('')}</select></label><label>Company access<select id=u_c><option value=all${u.co=='all'?' selected':''}>All companies</option>${Object.keys(CO).map(k=>`<option value=${k}${u.co==k?' selected':''}>${CO[k].n}</option>`).join('')}</select></label>${id?`<label><input type=checkbox id=u_a ${u.active?'checked':''} style="width:auto"> Active</label>`:''}</div><p><b>Assigned modules</b></p><div class=fg>${MODS.map(m=>`<label><input type=checkbox class=um value=${m[0]}${(u.mods||[]).includes(m[0])?' checked':''} style="width:auto"> ${m[1]}</label>`).join('')}</div>`,'usv2()')}
async function usv2(){const n=V('u_n').trim(),em=UE?'':V('u_u').trim().toLowerCase(),p=UE?'':V('u_p');if(!n||(!UE&&(!em||p.length<6)))return alert('Name, email and a password of 6+ characters are required');const o={name:n,role:V('u_r'),co:V('u_c'),mods:[...document.querySelectorAll('.um:checked')].map(c=>c.value),active:UE?$('#u_a').checked:true};let id=UE;
if(id==CU.id&&(o.role!='admin'||!o.active))return alert('You cannot remove your own admin access.');
if(!UE){const c=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}}),{data,error}=await c.auth.signUp({email:em,password:p,options:{data:{name:n}}});if(error)return alert(error.message);id=data.user.id}
const{error}=await sb.from('profiles').update(o).eq('id',id);if(error)return alert(error.message);PL=false;X();go()}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='erp-backup-'+today()+'.json';a.click()}
function demo(){if(!confirm('Load sample data for all companies?'))return;const d=seed();COLS.forEach(k=>S[k]=d[k]||[]);ensure();ensure3();save();go()}
const setp2=()=>`<div class=cd><h3>Connection</h3><p class=mu>Signed in as <b>${E(CU.email)}</b>. Data is shared live between all users.</p></div>`+(CU.role=='admin'?`<div class=cd><h3>Data tools</h3><p><button class=b onclick="exportJ()">Export backup (JSON)</button> ${S.items.length?'':'<button class=b onclick="demo()">Load demo data</button>'}</p><p class=mu>Demo data fills the three companies with sample records and is offered only while the database is empty.</p></div>`:'');
NAV.find(n=>n[0]=='set')[2]=setp2;NAV.find(n=>n[0]=='usr')[2]=usr2;
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);else go()})();
</script></body></html>
